name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      # No GPU on the runners, so this exercises the fall back to the CPU.
      # The dev group is torch, needed only by the parity test run by hand.
      - run: uv run --no-dev tests/test_poc.py
      - run: uv run --no-dev tests/test_no_numpy.py

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Check the tag matches the version
        shell: bash
        run: |
          version=$(uv version --short)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, but pyproject.toml says $version"; exit 1; }
      - run: uv run --no-dev python tools/build_standalone.py
      # The archive has to work with nothing but a bare interpreter behind it.
      - name: Smoke test the archive
        run: uv run --no-project --isolated --python 3.13 python -c "import sys; sys.path.insert(0, 'dist/nammy.pyzw'); from nammy import device; print(device.select())"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/nammy.pyzw --title "$GITHUB_REF_NAME" --generate-notes
